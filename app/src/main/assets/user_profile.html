<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil - Cibubur Rental Car</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
            padding-bottom: 70px;
        }
        .header {
            background-color: #0d6efd;
            color: white;
            padding: 15px 0;
        }
        .nav-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            background-color: white;
            border-top: 1px solid #dee2e6;
            padding: 10px 0;
        }
        .nav-item {
            text-align: center;
            font-size: 0.8rem;
        }
        .nav-item i {
            font-size: 1.2rem;
            display: block;
        }
        .profile-card {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin: 15px 0;
            text-align: center;
        }
        .profile-picture {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: #e9ecef;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: #6c757d;
            position: relative;
        }
        .camera-icon {
            position: absolute;
            bottom: 0;
            right: 0;
            background-color: #0d6efd;
            color: white;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .info-item {
            background-color: white;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin: 10px 0;
        }
        .action-button {
            background-color: white;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin: 10px 0;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <button class="btn btn-light">
                    <i class="bi bi-arrow-left"></i>
                </button>
                <div>Profil</div>
                <div></div>
            </div>
        </div>
    </div>

    <!-- Profile Card -->
    <div class="container profile-card">
        <div class="profile-picture">
            <i class="bi bi-person"></i>
            <div class="camera-icon">
                <i class="bi bi-camera"></i>
            </div>
        </div>
        <div class="fw-bold">Budi Santoso</div>
    </div>

    <!-- Personal Information -->
    <div class="container">
        <div class="info-item">
            <div class="d-flex justify-content-between">
                <div>
                    <div class="text-muted small">Email</div>
                    <div>budi.santoso@email.com</div>
                </div>
                <i class="bi bi-chevron-right"></i>
            </div>
        </div>
        
        <div class="info-item">
            <div class="d-flex justify-content-between">
                <div>
                    <div class="text-muted small">Nomor Telepon</div>
                    <div>+62 812 3456 7890</div>
                </div>
                <i class="bi bi-chevron-right"></i>
            </div>
        </div>
        
        <div class="info-item">
            <div class="d-flex justify-content-between">
                <div>
                    <div class="text-muted small">Alamat</div>
                    <div>Jl. Merdeka No. 123, Cibubur</div>
                </div>
                <i class="bi bi-chevron-right"></i>
            </div>
        </div>
        
        <div class="info-item">
            <div class="d-flex justify-content-between">
                <div>
                    <div class="text-muted small">Tanggal Lahir</div>
                    <div>15 Januari 1990</div>
                </div>
                <i class="bi bi-chevron-right"></i>
            </div>
        </div>
        
        <div class="info-item">
            <div class="d-flex justify-content-between">
                <div>
                    <div class="text-muted small">Jenis Kelamin</div>
                    <div>Laki-laki</div>
                </div>
                <i class="bi bi-chevron-right"></i>
            </div>
        </div>
    </div>

    <!-- Action Buttons -->
    <div class="container">
        <div class="action-button text-primary">
            <i class="bi bi-pencil"></i> Edit Profil
        </div>
        
        <div class="action-button text-primary">
            <i class="bi bi-clipboard"></i> Riwayat Penyewaan
        </div>
        
        <div class="action-button text-primary">
            <i class="bi bi-gear"></i> Pengaturan Akun
        </div>
        
        <div class="action-button text-danger">
            <i class="bi bi-box-arrow-right"></i> Keluar
        </div>
    </div>

    <!-- Navigation Bar -->
    <div class="nav-bar">
        <div class="container">
            <div class="row">
                <div class="col nav-item">
                    <i class="bi bi-house-door"></i>
                    <span>Beranda</span>
                </div>
                <div class="col nav-item">
                    <i class="bi bi-calendar"></i>
                    <span>Kalender</span>
                </div>
                <div class="col nav-item">
                    <i class="bi bi-clipboard"></i>
                    <span>Riwayat</span>
                </div>
                <div class="col nav-item">
                    <i class="bi bi-person text-primary"></i>
                    <span class="text-primary">Profil</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
