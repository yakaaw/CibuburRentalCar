<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengaturan Admin - Cibubur Rental Car</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
            padding-bottom: 70px;
        }
        .header {
            background-color: #0d6efd;
            color: white;
            padding: 15px 0;
        }
        .nav-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            background-color: white;
            border-top: 1px solid #dee2e6;
            padding: 10px 0;
        }
        .nav-item {
            text-align: center;
            font-size: 0.8rem;
        }
        .nav-item i {
            font-size: 1.2rem;
            display: block;
        }
        .profile-picture {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: #e9ecef;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: #6c757d;
            position: relative;
        }
        .camera-icon {
            position: absolute;
            bottom: 0;
            right: 0;
            background-color: #0d6efd;
            color: white;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .form-section {
            background-color: white;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin: 15px 0;
        }
        .notification-item {
            margin-bottom: 10px;
        }
        .setting-item {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <button class="btn btn-light">
                    <i class="bi bi-arrow-left"></i>
                </button>
                <div>Pengaturan Admin</div>
                <div></div>
            </div>
        </div>
    </div>

    <!-- Profile Picture -->
    <div class="container text-center mt-3">
        <div class="profile-picture">
            <i class="bi bi-person"></i>
            <div class="camera-icon">
                <i class="bi bi-camera"></i>
            </div>
        </div>
    </div>

    <!-- Admin Information -->
    <div class="container form-section">
        <div class="mb-3">
            <label class="form-label">Nama Admin:</label>
            <input type="text" class="form-control" value="Admin Cibubur Rental Car">
        </div>
        
        <div class="mb-3">
            <label class="form-label">Email:</label>
            <input type="email" class="form-control" value="admin@cibuburrentalcar.com">
        </div>
        
        <div class="mb-3">
            <label class="form-label">Nomor Telepon:</label>
            <input type="tel" class="form-control" value="+62 21 1234 5678">
        </div>
        
        <div class="mb-3">
            <label class="form-label">Alamat:</label>
            <textarea class="form-control" rows="2">Jl. Raya Cibubur No. 1, Cibubur</textarea>
        </div>
    </div>

    <!-- Security Settings -->
    <div class="container form-section">
        <h5>Keamanan:</h5>
        <div class="mb-3">
            <label class="form-label">Kata Sandi Saat Ini:</label>
            <input type="password" class="form-control" placeholder="**********************">
        </div>
        
        <div class="mb-3">
            <label class="form-label">Kata Sandi Baru:</label>
            <input type="password" class="form-control" placeholder="**********************">
        </div>
        
        <div class="mb-3">
            <label class="form-label">Konfirmasi Kata Sandi Baru:</label>
            <input type="password" class="form-control" placeholder="**********************">
        </div>
    </div>

    <!-- Notification Settings -->
    <div class="container form-section">
        <h5>Notifikasi:</h5>
        <div class="notification-item">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="newBooking" checked>
                <label class="form-check-label" for="newBooking">Email notifikasi booking baru</label>
            </div>
        </div>
        
        <div class="notification-item">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="payment" checked>
                <label class="form-check-label" for="payment">Email notifikasi pembayaran</label>
            </div>
        </div>
        
        <div class="notification-item">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="maintenance" checked>
                <label class="form-check-label" for="maintenance">Email notifikasi maintenance</label>
            </div>
        </div>
        
        <div class="notification-item">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="emergency" checked>
                <label class="form-check-label" for="emergency">SMS notifikasi darurat</label>
            </div>
        </div>
    </div>

    <!-- System Settings -->
    <div class="container form-section">
        <h5>Pengaturan Sistem:</h5>
        <div class="setting-item">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="autoConfirm" checked>
                <label class="form-check-label" for="autoConfirm">Otomatis konfirmasi booking</label>
            </div>
        </div>
        
        <div class="setting-item">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="includeDriver">
                <label class="form-check-label" for="includeDriver">Tampilkan harga termasuk driver</label>
            </div>
        </div>
        
        <div class="setting-item">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="returnLimit" checked>
                <label class="form-check-label" for="returnLimit">Batas waktu pengembalian 24 jam</label>
            </div>
        </div>
    </div>

    <!-- Save Button -->
    <div class="container mt-3">
        <button class="btn btn-primary w-100 py-3">
            <i class="bi bi-save"></i> Simpan Perubahan
        </button>
    </div>

    <!-- Navigation Bar -->
    <div class="nav-bar">
        <div class="container">
            <div class="row">
                <div class="col nav-item">
                    <i class="bi bi-bar-chart-line"></i>
                    <span>Dashboard</span>
                </div>
                <div class="col nav-item">
                    <i class="bi bi-car-front"></i>
                    <span>Mobil</span>
                </div>
                <div class="col nav-item">
                    <i class="bi bi-calendar"></i>
                    <span>Kalender</span>
                </div>
                <div class="col nav-item">
                    <i class="bi bi-gear text-primary"></i>
                    <span class="text-primary">Pengaturan</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
