<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profil - Cibubur Rental Car</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
            padding-bottom: 70px;
        }
        .header {
            background-color: #0d6efd;
            color: white;
            padding: 15px 0;
        }
        .nav-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            background-color: white;
            border-top: 1px solid #dee2e6;
            padding: 10px 0;
        }
        .nav-item {
            text-align: center;
            font-size: 0.8rem;
        }
        .nav-item i {
            font-size: 1.2rem;
            display: block;
        }
        .profile-picture {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: #e9ecef;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: #6c757d;
            position: relative;
        }
        .camera-icon {
            position: absolute;
            bottom: 0;
            right: 0;
            background-color: #0d6efd;
            color: white;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .form-section {
            background-color: white;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <button class="btn btn-light">
                    <i class="bi bi-arrow-left"></i>
                </button>
                <div>Edit Profil</div>
                <div></div>
            </div>
        </div>
    </div>

    <!-- Profile Picture -->
    <div class="container text-center mt-3">
        <div class="profile-picture">
            <i class="bi bi-person"></i>
            <div class="camera-icon">
                <i class="bi bi-camera"></i>
            </div>
        </div>
        <button class="btn btn-outline-primary btn-sm">
            <i class="bi bi-camera"></i> Ganti Foto
        </button>
    </div>

    <!-- Edit Form -->
    <div class="container form-section">
        <div class="mb-3">
            <label class="form-label">Nama Lengkap:</label>
            <input type="text" class="form-control" value="Budi Santoso">
        </div>
        
        <div class="mb-3">
            <label class="form-label">Email:</label>
            <input type="email" class="form-control" value="budi.santoso@email.com">
        </div>
        
        <div class="mb-3">
            <label class="form-label">Nomor Telepon:</label>
            <input type="tel" class="form-control" value="+62 812 3456 7890">
        </div>
        
        <div class="mb-3">
            <label class="form-label">Alamat:</label>
            <textarea class="form-control" rows="2">Jl. Merdeka No. 123, Cibubur</textarea>
        </div>
        
        <div class="mb-3">
            <label class="form-label">Tanggal Lahir:</label>
            <div class="input-group">
                <input type="date" class="form-control" value="1990-01-15">
                <span class="input-group-text"><i class="bi bi-calendar"></i></span>
            </div>
        </div>
        
        <div class="mb-3">
            <label class="form-label">Jenis Kelamin:</label>
            <div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="gender" id="male" value="male" checked>
                    <label class="form-check-label" for="male">Laki-laki</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="gender" id="female" value="female">
                    <label class="form-check-label" for="female">Perempuan</label>
                </div>
            </div>
        </div>
    </div>

    <!-- Action Buttons -->
    <div class="container">
        <div class="d-grid gap-2">
            <button class="btn btn-outline-secondary py-3">
                <i class="bi bi-x-circle"></i> Batal
            </button>
            <button class="btn btn-primary py-3">
                <i class="bi bi-save"></i> Simpan
            </button>
        </div>
    </div>

    <!-- Navigation Bar -->
    <div class="nav-bar">
        <div class="container">
            <div class="row">
                <div class="col nav-item">
                    <i class="bi bi-house-door"></i>
                    <span>Beranda</span>
                </div>
                <div class="col nav-item">
                    <i class="bi bi-calendar"></i>
                    <span>Kalender</span>
                </div>
                <div class="col nav-item">
                    <i class="bi bi-clipboard"></i>
                    <span>Riwayat</span>
                </div>
                <div class="col nav-item">
                    <i class="bi bi-person text-primary"></i>
                    <span class="text-primary">Profil</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
