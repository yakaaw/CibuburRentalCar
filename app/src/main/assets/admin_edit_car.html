<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Mobil - Cibubur Rental Car</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
            padding-bottom: 70px;
        }
        .header {
            background-color: #0d6efd;
            color: white;
            padding: 15px 0;
        }
        .nav-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            background-color: white;
            border-top: 1px solid #dee2e6;
            padding: 10px 0;
        }
        .nav-item {
            text-align: center;
            font-size: 0.8rem;
        }
        .nav-item i {
            font-size: 1.2rem;
            display: block;
        }
        .image-upload {
            background-color: white;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin: 15px 0;
            text-align: center;
        }
        .image-placeholder {
            width: 100px;
            height: 100px;
            background-color: #e9ecef;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: #6c757d;
            border-radius: 5px;
        }
        .form-section {
            background-color: white;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin: 15px 0;
        }
        .facility-checkbox {
            margin-right: 15px;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <button class="btn btn-light">
                    <i class="bi bi-arrow-left"></i>
                </button>
                <div>Edit Mobil / Tambah Mobil</div>
                <div></div>
            </div>
        </div>
    </div>

    <!-- Car Images -->
    <div class="container image-upload">
        <h5>Gambar Mobil:</h5>
        <div class="d-flex justify-content-center flex-wrap">
            <div class="image-placeholder m-2">
                <i class="bi bi-camera"></i>
            </div>
            <div class="image-placeholder m-2">
                <i class="bi bi-camera"></i>
            </div>
            <div class="image-placeholder m-2">
                <i class="bi bi-camera"></i>
            </div>
            <div class="image-placeholder m-2">
                <i class="bi bi-plus"></i>
            </div>
        </div>
    </div>

    <!-- Car Information Form -->
    <div class="container form-section">
        <div class="mb-3">
            <label class="form-label">Nama Mobil:</label>
            <input type="text" class="form-control" value="Toyota Brio">
        </div>
        
        <div class="mb-3">
            <label class="form-label">Merek:</label>
            <input type="text" class="form-control" value="Toyota">
        </div>
        
        <div class="mb-3">
            <label class="form-label">Tipe:</label>
            <input type="text" class="form-control" value="Hatchback">
        </div>
        
        <div class="mb-3">
            <label class="form-label">Transmisi:</label>
            <div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="transmission" id="manual" value="manual" checked>
                    <label class="form-check-label" for="manual">Manual</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="transmission" id="automatic" value="automatic">
                    <label class="form-check-label" for="automatic">Otomatis</label>
                </div>
            </div>
        </div>
        
        <div class="mb-3">
            <label class="form-label">Bahan Bakar:</label>
            <input type="text" class="form-control" value="Bensin">
        </div>
        
        <div class="mb-3">
            <label class="form-label">Kapasitas Penumpang:</label>
            <input type="number" class="form-control" value="5">
        </div>
        
        <div class="mb-3">
            <label class="form-label">Tahun:</label>
            <input type="number" class="form-control" value="2022">
        </div>
        
        <div class="mb-3">
            <label class="form-label">Harga Sewa per Hari (Rp):</label>
            <input type="number" class="form-control" value="500000">
        </div>
        
        <div class="mb-3">
            <label class="form-label">Fasilitas:</label>
            <div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" id="ac" checked>
                    <label class="form-check-label" for="ac">AC</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" id="audio" checked>
                    <label class="form-check-label" for="audio">Audio System</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" id="airbag" checked>
                    <label class="form-check-label" for="airbag">Airbag</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" id="powerWindows" checked>
                    <label class="form-check-label" for="powerWindows">Power Windows</label>
                </div>
            </div>
        </div>
        
        <div class="mb-3">
            <label class="form-label">Deskripsi:</label>
            <textarea class="form-control" rows="3">Toyota Brio adalah mobil hatchback yang hemat bahan bakar dan nyaman untuk perjalanan kota. Dilengkapi dengan AC, audio system, dan airbag.</textarea>
        </div>
        
        <div class="mb-3">
            <label class="form-label">Status:</label>
            <div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="status" id="available" value="available" checked>
                    <label class="form-check-label" for="available">Tersedia</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="status" id="rented" value="rented">
                    <label class="form-check-label" for="rented">Disewa</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="status" id="maintenance" value="maintenance">
                    <label class="form-check-label" for="maintenance">Maintenance</label>
                </div>
            </div>
        </div>
    </div>

    <!-- Action Buttons -->
    <div class="container">
        <div class="d-grid gap-2">
            <button class="btn btn-outline-secondary py-3">
                <i class="bi bi-x-circle"></i> Batal
            </button>
            <button class="btn btn-primary py-3">
                <i class="bi bi-save"></i> Simpan
            </button>
        </div>
    </div>

    <!-- Navigation Bar -->
    <div class="nav-bar">
        <div class="container">
            <div class="row">
                <div class="col nav-item">
                    <i class="bi bi-bar-chart-line"></i>
                    <span>Dashboard</span>
                </div>
                <div class="col nav-item">
                    <i class="bi bi-car-front text-primary"></i>
                    <span class="text-primary">Mobil</span>
                </div>
                <div class="col nav-item">
                    <i class="bi bi-calendar"></i>
                    <span>Kalender</span>
                </div>
                <div class="col nav-item">
                    <i class="bi bi-gear"></i>
                    <span>Pengaturan</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
